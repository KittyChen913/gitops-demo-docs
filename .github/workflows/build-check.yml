name: Build Check

# push 到 master 時自動驗證，但不部署。部署一律由 deploy.yml 手動觸發。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read           # 只建置，不需要寫入權限

concurrency:               # 連續 push 時只保留最新一次
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
